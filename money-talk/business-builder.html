<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autonomous Business Builder Lite</title><style>body{margin:0;background:#080b11;color:#f6f8fc;font-family:system-ui}*{box-sizing:border-box}.w{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.a{color:#7df9ff}.hero{padding:55px 0}.hero h1{font-size:52px;margin:8px 0}.muted{color:#96a3b7}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c{background:#101722;border:1px solid #263044;border-radius:16px;padding:18px}input,textarea,select{width:100%;padding:10px;margin:5px 0 10px;background:#080e16;border:1px solid #2b374d;border-radius:9px;color:white}textarea{min-height:75px}.b{padding:10px 14px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.check{padding:10px;border-bottom:1px solid #263044}.good{color:#6ee7a8}.warn{color:#ffd166}@media(max-width:800px){.g{grid-template-columns:1fr}.hero h1{font-size:39px}}</style></head><body><div class="w"><div class="top"><b>ADAM<span class="a">/BUSINESS BUILDER</span></b><a class="a" href="../store.html">← Store</a></div><section class="hero"><div class="muted">Money Talk · shared foundation</div><h1>Autonomous Business Builder Lite</h1><p class="muted">Not autonomous yet: a disciplined business-design engine that forces an idea into customer, pain, pilot, price, channel and proof.</p></section><div class="g"><div class="c"><h3>Business brief</h3><label>Idea<input id="idea"></label><label>Target customer<input id="customer"></label><label>Pain/problem<textarea id="pain"></textarea></label><label>Smallest paid pilot<textarea id="pilot"></textarea></label><label>Test price €<input id="price" type="number"></label><label>First acquisition channel<input id="channel"></label><button class="b" onclick="build()">Build launch card</button></div><div class="c"><h3>Readiness</h3><div id="result" class="muted">Fill the brief.</div></div></div></div><script>function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function build(){let f=[['Customer',customer.value],['Pain',pain.value],['Paid pilot',pilot.value],['Price',price.value],['Channel',channel.value]],done=f.filter(x=>String(x[1]).trim()).length;result.innerHTML=`<h2>${esc(idea.value||'Untitled business')}</h2>`+f.map(x=>`<div class='check'><b>${x[0]}:</b> ${esc(x[1]||'MISSING')}</div>`).join('')+`<p class='${done===5?'good':'warn'}'><b>${done}/5 launch gates defined.</b> ${done===5?'Ready for customer interviews and a paid pilot test.':'Do not build a full product yet.'}</p><p class='muted'>Next evidence: one real buyer conversation → one funded pilot → measured delivery economics → only then recurring infrastructure.</p>`}</script></body></html>
