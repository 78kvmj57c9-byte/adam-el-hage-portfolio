<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eval Lab</title><style>body{margin:0;background:#080b11;color:#f6f8fc;font-family:system-ui}*{box-sizing:border-box}.w{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.a{color:#7df9ff}.hero{padding:55px 0}.hero h1{font-size:54px;margin:8px 0}.muted{color:#96a3b7}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c{background:#101722;border:1px solid #263044;border-radius:16px;padding:18px}input,textarea,select{width:100%;padding:10px;margin:5px 0 10px;background:#080e16;border:1px solid #2b374d;border-radius:9px;color:#fff}textarea{min-height:75px}.b{padding:10px 14px;border:0;border-radius:9px;font-weight:800}.case{padding:13px;border:1px solid #263044;border-radius:10px;margin:8px 0}.pass{color:#6ee7a8}.fail{color:#ff7b8b}@media(max-width:800px){.g{grid-template-columns:1fr}.hero h1{font-size:40px}}</style></head><body><div class="w"><div class="top"><b>ADAM<span class="a">/EVAL LAB</span></b><a class="a" href="../store.html">← Store</a></div><section class="hero"><div class="muted">Trainer · Evaluator · Supervisor foundation</div><h1>Eval Lab</h1><p class="muted">Define acceptance tests before shipping. Record expected behavior, observed result and pass/fail evidence instead of trusting a demo once.</p></section><div class="g"><div class="c"><h3>Add test case</h3><label>System / feature<input id="sys"></label><label>Test name<input id="name"></label><label>Expected<textarea id="expected"></textarea></label><label>Observed<textarea id="observed"></textarea></label><label>Result<select id="result"><option>Pass</option><option>Fail</option><option>Blocked</option></select></label><button class="b" onclick="add()">Record test</button></div><div class="c"><h3>Evaluation set</h3><div id="summary" class="muted"></div><div id="cases"></div></div></div></div><script>let d=JSON.parse(localStorage.getItem('evalLab')||'[]');const e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function add(){if(!name.value.trim())return;d.push({id:Date.now(),sys:sys.value.trim(),n:name.value.trim(),ex:expected.value.trim(),ob:observed.value.trim(),r:result.value});name.value=expected.value=observed.value='';save()}function save(){localStorage.setItem('evalLab',JSON.stringify(d));render()}function rm(id){d=d.filter(x=>x.id!==id);save()}function render(){let p=d.filter(x=>x.r==='Pass').length;summary.innerHTML=`<b>${d.length}</b> tests · <b class='pass'>${p}</b> pass · <b class='fail'>${d.filter(x=>x.r==='Fail').length}</b> fail`;cases.innerHTML=d.map(x=>`<div class='case'><b>${e(x.sys||'System')} — ${e(x.n)}</b><p>Expected: ${e(x.ex)||'—'}</p><p>Observed: ${e(x.ob)||'—'}</p><b class='${x.r==='Pass'?'pass':x.r==='Fail'?'fail':''}'>${x.r}</b> <button onclick='rm(${x.id})'>×</button></div>`).join('')}render()</script></body></html>
