<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Vault</title><style>body{margin:0;background:#080b11;color:#f6f8fc;font-family:system-ui}*{box-sizing:border-box}.w{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.a{color:#7df9ff}.hero{padding:55px 0}.hero h1{font-size:52px;margin:8px 0}.muted{color:#96a3b7}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c{background:#101722;border:1px solid #263044;border-radius:16px;padding:18px}input,textarea,select{width:100%;padding:10px;margin:5px 0 10px;background:#080e16;border:1px solid #2b374d;border-radius:9px;color:#fff}textarea{min-height:70px}.b{padding:10px 14px;border:0;border-radius:9px;font-weight:800}.item{padding:12px;border:1px solid #263044;border-radius:10px;margin:8px 0}.tag{font-size:11px;color:#7df9ff}@media(max-width:800px){.g{grid-template-columns:1fr}.hero h1{font-size:39px}}</style></head><body><div class="w"><div class="top"><b>ADAM<span class="a">/EVIDENCE VAULT</span></b><a class="a" href="../store.html">← Store</a></div><section class="hero"><div class="muted">Memory / data foundation</div><h1>Evidence Vault</h1><p class="muted">Store decisions with sources, dates, confidence and what would change your mind. A small antidote to “I think we saw that somewhere.”</p></section><div class="g"><div class="c"><h3>Add evidence</h3><label>Claim / decision<input id="claim"></label><label>Source URL<input id="url"></label><label>Evidence note<textarea id="note"></textarea></label><label>Confidence<select id="conf"><option>Low</option><option>Medium</option><option>High</option></select></label><label>What would falsify/change it?<textarea id="change"></textarea></label><button class="b" onclick="add()">Save evidence</button></div><div class="c"><h3>Vault</h3><input id="search" placeholder="Filter..." oninput="render()"><div id="list"></div></div></div></div><script>let d=JSON.parse(localStorage.getItem('evidenceVault')||'[]');const e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function add(){if(!claim.value.trim())return;d.unshift({id:Date.now(),c:claim.value.trim(),u:url.value.trim(),n:note.value.trim(),f:conf.value,x:change.value.trim(),date:new Date().toISOString().slice(0,10)});claim.value=url.value=note.value=change.value='';save()}function save(){localStorage.setItem('evidenceVault',JSON.stringify(d));render()}function rm(id){d=d.filter(x=>x.id!==id);save()}function render(){let q=(search.value||'').toLowerCase(),v=d.filter(x=>JSON.stringify(x).toLowerCase().includes(q));list.innerHTML=v.map(x=>`<div class='item'><div class='tag'>${x.date} · ${x.f} confidence</div><b>${e(x.c)}</b><p>${e(x.n)||'—'}</p><p>${x.u?`<a class='a' href='${e(x.u)}' target='_blank'>Source</a>`:'No URL'}</p><p><b>Change trigger:</b> ${e(x.x)||'—'}</p><button onclick='rm(${x.id})'>Delete</button></div>`).join('')||'<p class="muted">No matching evidence.</p>'}render()</script></body></html>
