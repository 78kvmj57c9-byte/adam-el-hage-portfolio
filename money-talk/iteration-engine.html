<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iteration Engine</title><style>body{margin:0;background:#080b11;color:#f6f8fc;font-family:system-ui}*{box-sizing:border-box}.w{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.a{color:#7df9ff}.hero{padding:55px 0}.hero h1{font-size:52px;margin:8px 0}.muted{color:#96a3b7}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c{background:#101722;border:1px solid #263044;border-radius:16px;padding:18px}input,textarea{width:100%;padding:10px;margin:5px 0 10px;background:#080e16;border:1px solid #2b374d;border-radius:9px;color:#fff}textarea{min-height:65px}.b{padding:10px 14px;border:0;border-radius:9px;font-weight:800}.item{padding:12px;border:1px solid #263044;border-radius:10px;margin:8px 0}.good{color:#6ee7a8}.bad{color:#ff7b8b}@media(max-width:800px){.g{grid-template-columns:1fr}.hero h1{font-size:39px}}</style></head><body><div class="w"><div class="top"><b>ADAM<span class="a">/ITERATION ENGINE</span></b><a class="a" href="../store.html">← Store</a></div><section class="hero"><div class="muted">Self-improving factory foundation</div><h1>Iteration Engine</h1><p class="muted">Promote changes only when a measured score improves. Keep failures as evidence instead of silently rewriting history.</p></section><div class="g"><div class="c"><h3>Log experiment</h3><label>Change / hypothesis<input id="change"></label><label>Baseline score<input id="before" type="number" step="0.01"></label><label>New score<input id="after" type="number" step="0.01"></label><label>Evidence<textarea id="evidence"></textarea></label><button class="b" onclick="add()">Record experiment</button></div><div class="c"><h3>Promotion queue</h3><div id="list"></div></div></div></div><script>let d=JSON.parse(localStorage.getItem('iterationEngine')||'[]');const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function add(){if(!change.value.trim())return;d.push({id:Date.now(),c:change.value.trim(),b:+before.value,a:+after.value,e:evidence.value.trim()});change.value=evidence.value=before.value=after.value='';save()}function save(){localStorage.setItem('iterationEngine',JSON.stringify(d));render()}function rm(id){d=d.filter(x=>x.id!==id);save()}function render(){list.innerHTML=d.map(x=>{let delta=x.a-x.b,ok=delta>0;return `<div class='item'><b>${esc(x.c)}</b><p>${x.b} → ${x.a} (<span class='${ok?'good':'bad'}'>${delta>=0?'+':''}${delta.toFixed(2)}</span>)</p><p>${esc(x.e)||'No evidence note'}</p><b class='${ok?'good':'bad'}'>${ok?'PROMOTE CANDIDATE':'DO NOT PROMOTE'}</b> <button onclick='rm(${x.id})'>×</button></div>`}).join('')||'<p class="muted">No experiments yet.</p>'}render()</script></body></html>
