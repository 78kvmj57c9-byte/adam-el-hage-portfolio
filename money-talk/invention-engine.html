<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invention Engine</title><style>body{margin:0;background:#080b11;color:#f6f8fc;font-family:system-ui}*{box-sizing:border-box}.w{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.a{color:#7df9ff}.hero{padding:55px 0}.hero h1{font-size:52px;margin:8px 0}.muted{color:#96a3b7}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c{background:#101722;border:1px solid #263044;border-radius:16px;padding:18px}input,textarea{width:100%;padding:10px;margin:5px 0 10px;background:#080e16;border:1px solid #2b374d;border-radius:9px;color:#fff}textarea{min-height:70px}.b{padding:10px 14px;border:0;border-radius:9px;font-weight:800}.idea{padding:12px;border:1px solid #263044;border-radius:10px;margin:8px 0}.score{color:#7df9ff;font-weight:900}@media(max-width:800px){.g{grid-template-columns:1fr}.hero h1{font-size:39px}}</style></head><body><div class="w"><div class="top"><b>ADAM<span class="a">/INVENTION ENGINE</span></b><a class="a" href="../store.html">← Store</a></div><section class="hero"><div class="muted">Invention Engine foundation</div><h1>Invention Engine</h1><p class="muted">Capture a weird idea, state the real problem, rate impact/novelty/feasibility, and define the cheapest experiment before building the expensive version.</p></section><div class="g"><div class="c"><h3>New invention</h3><label>Idea<input id="idea"></label><label>Problem it solves<textarea id="problem"></textarea></label><label>Impact 1–10<input id="impact" type="number" min="1" max="10" value="7"></label><label>Novelty 1–10<input id="novel" type="number" min="1" max="10" value="7"></label><label>Feasibility 1–10<input id="feas" type="number" min="1" max="10" value="5"></label><label>Cheapest test<textarea id="test"></textarea></label><button class="b" onclick="add()">Add invention</button></div><div class="c"><h3>Idea bank</h3><div id="list"></div></div></div></div><script>let d=JSON.parse(localStorage.getItem('inventionEngine')||'[]');const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const score=x=>x.i+x.n+x.f;function add(){if(!idea.value.trim())return;d.push({id:Date.now(),idea:idea.value.trim(),p:problem.value.trim(),i:+impact.value,n:+novel.value,f:+feas.value,t:test.value.trim()});idea.value=problem.value=test.value='';save()}function save(){localStorage.setItem('inventionEngine',JSON.stringify(d));render()}function rm(id){d=d.filter(x=>x.id!==id);save()}function render(){d.sort((a,b)=>score(b)-score(a));list.innerHTML=d.map(x=>`<div class='idea'><b>${esc(x.idea)}</b> <span class='score'>${score(x)}/30</span><p>${esc(x.p)||'No problem statement'}</p><p><b>Cheapest test:</b> ${esc(x.t)||'MISSING'}</p><button onclick='rm(${x.id})'>Delete</button></div>`).join('')||'<p class="muted">No inventions yet.</p>'}render()</script></body></html>
