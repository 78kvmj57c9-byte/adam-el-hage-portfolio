<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflow Compiler Lite</title><style>body{margin:0;background:#080b11;color:#f6f8fc;font-family:system-ui}*{box-sizing:border-box}.w{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.a{color:#7df9ff}.hero{padding:55px 0}.hero h1{font-size:52px;margin:8px 0}.muted{color:#96a3b7}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c{background:#101722;border:1px solid #263044;border-radius:16px;padding:18px}input,textarea{width:100%;padding:10px;margin:5px 0 10px;background:#080e16;border:1px solid #2b374d;border-radius:9px;color:white}textarea{min-height:70px}.b{padding:10px 14px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.step{padding:13px;border:1px solid #263044;border-radius:10px;margin:8px 0}@media(max-width:800px){.g{grid-template-columns:1fr}.hero h1{font-size:38px}}</style></head><body><div class="w"><div class="top"><b>ADAM<span class="a">/WORKFLOW COMPILER</span></b><a class="a" href="../store.html">← Store</a></div><section class="hero"><div class="muted">Money Talk · enterprise foundation</div><h1>Workflow Compiler Lite</h1><p class="muted">Turn a human procedure into explicit steps with inputs, outputs, failure conditions and an owner before automating anything.</p></section><div class="g"><div class="c"><h3>Add procedure step</h3><label>Workflow name<input id="wf"></label><label>Step name<input id="sn"></label><label>Input<textarea id="inp"></textarea></label><label>Expected output<textarea id="out"></textarea></label><label>Failure / exception<textarea id="fail"></textarea></label><label>Owner<input id="owner"></label><button class="b" onclick="add()">Add step</button></div><div class="c"><h3 id="title">Untitled workflow</h3><div id="steps"></div><button onclick="exportJson()">Export JSON</button></div></div></div><script>let d=JSON.parse(localStorage.getItem('workflowCompiler')||'{"name":"","steps":[]}');const e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function add(){if(wf.value.trim())d.name=wf.value.trim();if(!sn.value.trim())return;d.steps.push({id:Date.now(),step:sn.value.trim(),input:inp.value.trim(),output:out.value.trim(),failure:fail.value.trim(),owner:owner.value.trim()});sn.value=inp.value=out.value=fail.value=owner.value='';save()}function save(){localStorage.setItem('workflowCompiler',JSON.stringify(d));render()}function rm(id){d.steps=d.steps.filter(x=>x.id!==id);save()}function render(){title.textContent=d.name||'Untitled workflow';steps.innerHTML=d.steps.map((x,i)=>`<div class='step'><b>${i+1}. ${e(x.step)}</b><p><b>Input:</b> ${e(x.input)||'—'}</p><p><b>Output:</b> ${e(x.output)||'—'}</p><p><b>Failure:</b> ${e(x.failure)||'—'}</p><p><b>Owner:</b> ${e(x.owner)||'—'} <button onclick='rm(${x.id})'>×</button></p></div>`).join('')||'<p class="muted">Add steps before automating.</p>'}function exportJson(){let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='workflow.json';a.click();URL.revokeObjectURL(a.href)}render()</script></body></html>
