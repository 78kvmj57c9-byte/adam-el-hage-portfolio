<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype Lab</title><style>body{margin:0;background:#080b11;color:#f6f8fc;font-family:system-ui}*{box-sizing:border-box}.w{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.a{color:#7df9ff}.hero{padding:55px 0}.hero h1{font-size:54px;margin:8px 0}.muted{color:#96a3b7}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.c{background:#101722;border:1px solid #263044;border-radius:16px;padding:18px}input,textarea,select{width:100%;padding:10px;margin:5px 0 10px;background:#080e16;border:1px solid #2b374d;border-radius:9px;color:white}textarea{min-height:80px}.b{padding:10px 14px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.item{padding:14px;border:1px solid #263044;border-radius:12px;margin:8px 0}.tag{font-size:11px;color:#7df9ff}@media(max-width:800px){.g{grid-template-columns:1fr}.hero h1{font-size:40px}}</style></head><body><div class="w"><div class="top"><b>ADAM<span class="a">/PROTOTYPE LAB</span></b><a class="a" href="../store.html">← Store</a></div><section class="hero"><div class="muted">Money Talk · shared foundation</div><h1>Prototype Lab</h1><p class="muted">Turn an idea into a falsifiable prototype: hypothesis, smallest build, acceptance test, result and next decision.</p></section><div class="g"><div class="c"><h3>New experiment</h3><label>Idea<input id="idea"></label><label>Hypothesis<textarea id="hyp"></textarea></label><label>Smallest prototype<textarea id="mvp"></textarea></label><label>Acceptance test<textarea id="test"></textarea></label><button class="b" onclick="add()">Create experiment</button></div><div class="c"><h3>Experiment registry</h3><div id="list"></div></div></div></div><script>let d=JSON.parse(localStorage.getItem('prototypeLab')||'[]');const e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function add(){if(!idea.value.trim())return;d.push({id:Date.now(),idea:idea.value.trim(),h:hyp.value.trim(),m:mvp.value.trim(),t:test.value.trim(),status:'Not tested'});idea.value=hyp.value=mvp.value=test.value='';save()}function save(){localStorage.setItem('prototypeLab',JSON.stringify(d));render()}function st(id,v){d.find(x=>x.id===id).status=v;save()}function rm(id){d=d.filter(x=>x.id!==id);save()}function render(){list.innerHTML=d.map(x=>`<div class='item'><div class='tag'>${e(x.status)}</div><b>${e(x.idea)}</b><p><b>Hypothesis:</b> ${e(x.h)||'—'}</p><p><b>Prototype:</b> ${e(x.m)||'—'}</p><p><b>Test:</b> ${e(x.t)||'—'}</p><select onchange='st(${x.id},this.value)'><option${x.status==='Not tested'?' selected':''}>Not tested</option><option${x.status==='Passed'?' selected':''}>Passed</option><option${x.status==='Failed'?' selected':''}>Failed</option><option${x.status==='Needs iteration'?' selected':''}>Needs iteration</option></select><button onclick='rm(${x.id})'>Delete</button></div>`).join('')||'<p class="muted">No experiments yet.</p>'}render()</script></body></html>
