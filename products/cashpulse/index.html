<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CashPulse</title><style>body{font-family:system-ui;background:#0b0c12;color:#f5f7ff;padding:28px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#141725;border:1px solid #2a3046;padding:18px;border-radius:16px}.kpi{font-size:30px;font-weight:900}input,select,button{padding:10px;border-radius:9px;border:1px solid #3b425e;background:#10131d;color:#fff;margin:4px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #2d3349;text-align:left}.neg{color:#ff9fa8}.pos{color:#9fffc2}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>CashPulse</h1><p>Simple monthly cash-in / cash-out monitor for small businesses. This is an operations tool, not accounting or tax advice.</p><div class='grid'><div class='card'><div class='kpi' id='income'>€0</div><small>Income</small></div><div class='card'><div class='kpi' id='expense'>€0</div><small>Expenses</small></div><div class='card'><div class='kpi' id='net'>€0</div><small>Net cash</small></div></div><h2>Add transaction</h2><input id='date' type='date'><input id='desc' placeholder='Description'><select id='type'><option>Income</option><option>Expense</option></select><input id='amount' type='number' step='0.01' placeholder='Amount'><button onclick='add()'>Add</button><button onclick='clearAll()'>Clear demo</button><table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th></tr></thead><tbody id='rows'></tbody></table><script>let data=JSON.parse(localStorage.getItem('cashpulse')||'[]');function add(){data.push({d:date.value,x:desc.value,t:type.value,a:+amount.value||0});save()}function clearAll(){data=[];save()}function save(){localStorage.setItem('cashpulse',JSON.stringify(data));render()}function render(){rows.innerHTML='';let i=0,e=0;data.forEach(x=>{if(x.t==='Income')i+=x.a;else e+=x.a;rows.innerHTML+=`<tr><td>${x.d}</td><td>${x.x}</td><td>${x.t}</td><td class='${x.t==='Income'?'pos':'neg'}'>${x.t==='Income'?'+':'-'}€${x.a.toFixed(2)}</td></tr>`});income.textContent='€'+i.toFixed(0);expense.textContent='€'+e.toFixed(0);net.textContent='€'+(i-e).toFixed(0);net.className='kpi '+((i-e)>=0?'pos':'neg')}render()</script>
