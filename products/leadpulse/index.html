<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>LeadPulse</title><style>body{font-family:system-ui;background:#081018;color:#eef;padding:28px;max-width:1000px;margin:auto}h1{font-size:42px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#111b27;border:1px solid #243246;padding:18px;border-radius:16px}input,select,button{padding:10px;border-radius:9px;border:1px solid #314158;background:#0d1621;color:#fff;margin:4px}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{border-bottom:1px solid #263649;padding:10px;text-align:left}.kpi{font-size:28px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>LeadPulse</h1><p>Lightweight lead follow-up dashboard. Runs locally in the browser and stores demo data in localStorage.</p><div class='grid'><div class='card'><div class='kpi' id='open'>0</div><small>Open leads</small></div><div class='card'><div class='kpi' id='hot'>0</div><small>Hot leads</small></div><div class='card'><div class='kpi' id='due'>0</div><small>Follow-ups due</small></div></div><h2>Add lead</h2><input id='name' placeholder='Company / person'><input id='value' type='number' placeholder='Deal value'><select id='stage'><option>New</option><option>Contacted</option><option>Proposal</option><option>Hot</option><option>Won</option><option>Lost</option></select><input id='date' type='date'><button onclick='add()'>Add</button><button onclick='clearAll()'>Clear demo</button><table><thead><tr><th>Lead</th><th>Value</th><th>Stage</th><th>Follow-up</th></tr></thead><tbody id='rows'></tbody></table><script>let leads=JSON.parse(localStorage.getItem('leadpulse')||'[]');function add(){leads.push({n:name.value,v:+value.value||0,s:stage.value,d:date.value});save()}function clearAll(){leads=[];save()}function save(){localStorage.setItem('leadpulse',JSON.stringify(leads));render()}function render(){rows.innerHTML='';let today=new Date().toISOString().slice(0,10);leads.forEach(x=>rows.innerHTML+=`<tr><td>${x.n}</td><td>€${x.v.toFixed(0)}</td><td>${x.s}</td><td>${x.d||'—'}</td></tr>`);open.textContent=leads.filter(x=>!['Won','Lost'].includes(x.s)).length;hot.textContent=leads.filter(x=>x.s==='Hot').length;due.textContent=leads.filter(x=>x.d&&x.d<=today&&!['Won','Lost'].includes(x.s)).length}render()</script>
