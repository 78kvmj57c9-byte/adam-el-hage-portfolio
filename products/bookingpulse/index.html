<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>BookingPulse</title><style>body{font-family:system-ui;background:#071014;color:#ecfbff;padding:28px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#0e1a20;border:1px solid #24404a;padding:18px;border-radius:16px}.kpi{font-size:30px;font-weight:900}input,select,button{padding:10px;border-radius:9px;border:1px solid #31505b;background:#0b161b;color:#fff;margin:4px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #29434c;text-align:left}.warn{color:#ffca91;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>BookingPulse</h1><p>Simple appointment/booking tracker for service businesses. Tracks upcoming bookings, no-shows and follow-up status.</p><div class='grid'><div class='card'><div class='kpi' id='upcoming'>0</div><small>Upcoming</small></div><div class='card'><div class='kpi' id='noshow'>0</div><small>No-shows</small></div><div class='card'><div class='kpi' id='follow'>0</div><small>Follow-ups due</small></div></div><h2>Add booking</h2><input id='client' placeholder='Client'><input id='date' type='date'><select id='status'><option>Booked</option><option>Completed</option><option>No-show</option><option>Cancelled</option></select><select id='fu'><option>No follow-up</option><option>Follow-up due</option><option>Followed up</option></select><button onclick='add()'>Add</button><button onclick='clearAll()'>Clear demo</button><table><thead><tr><th>Client</th><th>Date</th><th>Status</th><th>Follow-up</th></tr></thead><tbody id='rows'></tbody></table><script>let data=JSON.parse(localStorage.getItem('bookingpulse')||'[]');function add(){data.push({c:client.value,d:date.value,s:status.value,f:fu.value});save()}function clearAll(){data=[];save()}function save(){localStorage.setItem('bookingpulse',JSON.stringify(data));render()}function render(){rows.innerHTML='';let t=new Date().toISOString().slice(0,10);data.forEach(x=>rows.innerHTML+=`<tr><td>${x.c}</td><td>${x.d}</td><td class='${x.s==='No-show'?'warn':''}'>${x.s}</td><td>${x.f}</td></tr>`);upcoming.textContent=data.filter(x=>x.s==='Booked'&&x.d>=t).length;noshow.textContent=data.filter(x=>x.s==='No-show').length;follow.textContent=data.filter(x=>x.f==='Follow-up due').length}render()</script>
