<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>StockPulse</title><style>body{font-family:system-ui;background:#0b0f14;color:#f4f7fb;padding:28px;max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#141b24;border:1px solid #263244;padding:18px;border-radius:16px}.kpi{font-size:30px;font-weight:900}input,button{padding:10px;border-radius:9px;border:1px solid #344256;background:#0d141d;color:#fff;margin:4px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #293647;text-align:left}.low{color:#ffb4b4;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>StockPulse</h1><p>Simple stock and reorder monitor for small businesses.</p><div class='grid'><div class='card'><div class='kpi' id='items'>0</div><small>Items tracked</small></div><div class='card'><div class='kpi' id='low'>0</div><small>Below reorder point</small></div><div class='card'><div class='kpi' id='value'>€0</div><small>Stock value</small></div></div><h2>Add item</h2><input id='sku' placeholder='SKU'><input id='name' placeholder='Item name'><input id='qty' type='number' placeholder='Qty'><input id='reorder' type='number' placeholder='Reorder point'><input id='cost' type='number' step='0.01' placeholder='Unit cost'><button onclick='add()'>Add</button><button onclick='clearAll()'>Clear demo</button><table><thead><tr><th>SKU</th><th>Item</th><th>Qty</th><th>Reorder</th><th>Unit cost</th><th>Status</th></tr></thead><tbody id='rows'></tbody></table><script>let data=JSON.parse(localStorage.getItem('stockpulse')||'[]');function add(){data.push({sku:sku.value,n:name.value,q:+qty.value||0,r:+reorder.value||0,c:+cost.value||0});save()}function clearAll(){data=[];save()}function save(){localStorage.setItem('stockpulse',JSON.stringify(data));render()}function render(){rows.innerHTML='';let lows=0,val=0;data.forEach(x=>{let isLow=x.q<=x.r;lows+=isLow?1:0;val+=x.q*x.c;rows.innerHTML+=`<tr><td>${x.sku}</td><td>${x.n}</td><td>${x.q}</td><td>${x.r}</td><td>€${x.c.toFixed(2)}</td><td class='${isLow?'low':''}'>${isLow?'REORDER':'OK'}</td></tr>`});items.textContent=data.length;low.textContent=lows;value.textContent='€'+val.toFixed(0)}render()</script>
