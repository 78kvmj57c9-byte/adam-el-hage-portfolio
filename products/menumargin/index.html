<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MenuMargin</title><style>body{font-family:system-ui;background:#100d0a;color:#fff4e8;padding:28px;max-width:980px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#1b1510;border:1px solid #3c2d21;padding:18px;border-radius:16px}.kpi{font-size:30px;font-weight:900}input,button{padding:10px;border-radius:9px;border:1px solid #4c392a;background:#17110d;color:#fff;margin:4px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #3a2b20;text-align:left}.bad{color:#ffb6a8;font-weight:800}.good{color:#a8ffc0;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>MenuMargin</h1><p>Menu pricing and contribution dashboard for restaurants, cafés and takeaway businesses.</p><div class='grid'><div class='card'><div class='kpi' id='avg'>0%</div><small>Average gross margin</small></div><div class='card'><div class='kpi' id='weak'>0</div><small>Items below 60%</small></div><div class='card'><div class='kpi' id='count'>0</div><small>Menu items</small></div></div><h2>Add menu item</h2><input id='name' placeholder='Item'><input id='price' type='number' step='0.01' placeholder='Sell price'><input id='cost' type='number' step='0.01' placeholder='Food cost'><button onclick='add()'>Add</button><button onclick='clearAll()'>Clear demo</button><table><thead><tr><th>Item</th><th>Price</th><th>Cost</th><th>Contribution</th><th>Margin</th><th>Status</th></tr></thead><tbody id='rows'></tbody></table><script>let data=JSON.parse(localStorage.getItem('menumargin')||'[]');function add(){data.push({n:name.value,p:+price.value||0,c:+cost.value||0});save()}function clearAll(){data=[];save()}function save(){localStorage.setItem('menumargin',JSON.stringify(data));render()}function render(){rows.innerHTML='';let sum=0,w=0;data.forEach(x=>{let m=x.p?((x.p-x.c)/x.p):0;sum+=m;if(m<.6)w++;rows.innerHTML+=`<tr><td>${x.n}</td><td>€${x.p.toFixed(2)}</td><td>€${x.c.toFixed(2)}</td><td>€${(x.p-x.c).toFixed(2)}</td><td>${(m*100).toFixed(1)}%</td><td class='${m<.6?'bad':'good'}'>${m<.6?'REVIEW':'HEALTHY'}</td></tr>`});count.textContent=data.length;weak.textContent=w;avg.textContent=(data.length?sum/data.length*100:0).toFixed(1)+'%'}render()</script>
